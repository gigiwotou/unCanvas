apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncanvas-frontend
  labels:
    app: uncanvas-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uncanvas-frontend
  template:
    metadata:
      labels:
        app: uncanvas-frontend
    spec:
      containers:
        - name: frontend
          image: uncanvas-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:3001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: uncanvas-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
