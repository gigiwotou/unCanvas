apiVersion: apps/v1
kind: Deployment
metadata:
  name: uncanvas-backend
  labels:
    app: uncanvas-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uncanvas-backend
  template:
    metadata:
      labels:
        app: uncanvas-backend
    spec:
      containers:
        - name: backend
          image: uncanvas-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: "uncanvas"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uncanvas-secrets
                  key: db-password
            - name: DB_DATABASE
              value: "uncanvas"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: uncanvas-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: uncanvas-backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
